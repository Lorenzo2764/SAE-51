// /etc/kea/kea-dhcp4.conf : serveur DHCP du lab d'auto-provisioning
//
// Architecture :
//   - Kea (192.168.0.1) reçoit les requêtes relayées par le routeur FAI (giaddr 203.0.113.1)
//   - Les routeurs autorisés sont lus dans la table "hosts" de la base SAE-51 (PostgreSQL, 192.168.0.3)
//   - Un routeur absent de la base n'obtient aucun bail (pool réservé à la classe KNOWN)

{
"Dhcp4": {

    "interfaces-config": {
        // Interface du réseau privé (192.168.0.1). Le mode udp est nécessaire pour les requêtes relayées.
        "interfaces": [ "enp0s3/192.168.0.1" ],
        "dhcp-socket-type": "udp"
    },

    // Baux : fichier local (les autorisations sont en base, pas les baux)
    "lease-database": {
        "type": "memfile",
        "persist": true,
        "name": "/var/lib/kea/kea-leases4.csv"
    },

    // Réservations : table "hosts" de Kea dans la base SAE-51
    "hosts-database": {
        "type": "postgresql",
        "host": "192.168.0.3",
        "name": "SAE-51",
        "user": "kea",
        "password": "kea"
    },

    // Les routeurs clients sont identifiés par leur adresse MAC
    "host-reservation-identifiers": [ "hw-address" ],

    "valid-lifetime": 3600,

    "subnet4": [
        {
            // Cet identifiant doit correspondre à dhcp4_subnet_id dans la table hosts
            "id": 1,
            "subnet": "203.0.113.0/24",

            // Plages :
            //   203.0.113.1        routeur FAI (IP publique)
            //   203.0.113.2 - .99 IP fixes des clients ayant souscrit l'option (hors pool)
            //   203.0.113.100 - .250 pool dynamique, réservé aux routeurs connus (classe KNOWN)
            "pools": [
                {
                    "pool": "203.0.113.100 - 203.0.113.250",
                    "client-class": "KNOWN"
                }
            ],

            "option-data": [
                // Passerelle, DNS : l'IP publique du routeur FAI (redirection du port 53 vers le DNS)
                { "name": "routers",             "data": "203.0.113.1" },
                { "name": "domain-name-servers", "data": "203.0.113.1" },
                { "name": "domain-name",         "data": "operateur.lab" }
            ]
        }
    ],

    // Journaux : consulter avec  journalctl -u kea-dhcp4-server
    "loggers": [
        {
            "name": "kea-dhcp4",
            "output_options": [ { "output": "stdout" } ],
            "severity": "INFO"
        }
    ]
}
}
