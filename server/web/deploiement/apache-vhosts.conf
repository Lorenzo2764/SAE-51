# a2enmod ssl proxy proxy_http headers ; a2ensite provisioning
# Portail client : exposé sur Internet (redirection 443 du routeur FAI vers 192.168.0.3)
<VirtualHost *:443>
    ServerName portail.operateur.lab
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/provisioning.crt
    SSLCertificateKeyFile /etc/ssl/private/provisioning.key
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8001/
    ProxyPassReverse / http://127.0.0.1:8001/
    Header always set Strict-Transport-Security "max-age=31536000"
</VirtualHost>

# Administration : écoute sur le port 8443, JAMAIS redirigé par le routeur FAI,
# et limité à l'intranet (réseau d'administration 192.168.56.0/24)
Listen 8443
<VirtualHost *:8443>
    ServerName admin.operateur.lab
    SSLEngine on
    SSLCertificateFile    /etc/ssl/certs/provisioning.crt
    SSLCertificateKeyFile /etc/ssl/private/provisioning.key
    <Location />
        Require ip 192.168.56.0/24
    </Location>
    RequestHeader set X-Forwarded-Proto "https"
    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:8002/
    ProxyPassReverse / http://127.0.0.1:8002/
</VirtualHost>
